# alacritty.toml
[font]
size = 18

[window]
opacity = 0.8

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.selection]
text = "#282828"
background = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#726354"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"


[[keyboard.bindings]]
key = "Escape"
mods = "Control"
chars = "\u001b[27;5u"

[[keyboard.bindings]]
key = "1"
mods = "Control"
chars = "\u001b[49;5u"

[[keyboard.bindings]]
key = "2"
mods = "Control"
chars = "\u001b[50;5u"

[[keyboard.bindings]]
key = "3"
mods = "Control"
chars = "\u001b[51;5u"

[[keyboard.bindings]]
key = "4"
mods = "Control"
chars = "\u001b[52;5u"

[[keyboard.bindings]]
key = "5"
mods = "Control"
chars = "\u001b[53;5u"

[[keyboard.bindings]]
key = "6"
mods = "Control"
chars = "\u001b[54;5u"

[[keyboard.bindings]]
key = "7"
mods = "Control"
