# alacritty.toml

[font]
size = 32

[window]
opacity = 0.8

[colors.primary]
background = "#030000"
foreground = "#d4be98"

# Normal colors
[colors.normal]
black   = '#22201f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'

# Bright colors (same as normal colors)
[colors.bright]
black   = '#42403f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'


[[keyboard.bindings]]
key = "Escape"
mods = "Control"
chars = "\u001b[27;5u"

[[keyboard.bindings]]
key = "1"
mods = "Control"
chars = "\u001b[49;5u"

[[keyboard.bindings]]
key = "2"
mods = "Control"
chars = "\u001b[50;5u"

[[keyboard.bindings]]
key = "3"
mods = "Control"
chars = "\u001b[51;5u"

[[keyboard.bindings]]
key = "4"
mods = "Control"
chars = "\u001b[52;5u"

[[keyboard.bindings]]
key = "5"
mods = "Control"
chars = "\u001b[53;5u"

[[keyboard.bindings]]
key = "6"
mods = "Control"
chars = "\u001b[54;5u"

[[keyboard.bindings]]
key = "7"
mods = "Control"
chars = "\u001b[55;5u"

[[keyboard.bindings]]
key = "8"
mods = "Control"
chars = "\u001b[56;5u"

[[keyboard.bindings]]
key = "9"
